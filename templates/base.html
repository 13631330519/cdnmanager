<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CDN管理器{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-indigo-700 text-white shadow-lg shrink-0">
        <div class="px-4 md:px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center">
                <i class="fas fa-cloud-upload-alt mr-2"></i> CDN管理器
            </h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm hidden sm:inline">欢迎, <strong>{{ user.username }}</strong></span>
                <a href="{{ url_for('logout') }}" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm transition">退出</a>
            </div>
        </div>
    </header>

    <div id="appShell" class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="bg-white border-r border-gray-200 shrink-0 flex flex-col">
            <div class="p-3 border-b flex items-center justify-between gap-2">
                <span class="sidebar-brand-text text-xs font-semibold text-gray-500 uppercase tracking-wide">导航</span>
                <button type="button" id="sidebarToggle" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600" title="折叠侧边栏">
                    <i class="fas fa-angles-left"></i>
                </button>
            </div>
            <nav class="flex-1 overflow-y-auto p-2 space-y-3" role="tablist">
                <div class="sidebar-group" data-group="main">
                    <button type="button" class="sidebar-group-title w-full flex items-center justify-between px-2 py-1.5 text-xs font-semibold text-gray-400 uppercase">
                        <span class="sidebar-group-title-text">常用</span>
                        <i class="fas fa-chevron-down text-[10px] sidebar-group-chevron"></i>
                    </button>
                    <div class="sidebar-group-items space-y-0.5 mt-1">
                        <button type="button" class="tab-btn active" data-tab="domains" role="tab">
                            <i class="fas fa-globe w-4 text-center"></i><span class="sidebar-label">域名管理</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="urls" role="tab">
                            <i class="fas fa-history w-4 text-center"></i><span class="sidebar-label">刷新记录</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="upload" role="tab">
                            <i class="fas fa-cloud-upload-alt w-4 text-center"></i><span class="sidebar-label">文件存储</span>
                        </button>
                    </div>
                </div>
                {% if user.role == 'admin' %}
                <div class="sidebar-group" data-group="admin">
                    <button type="button" class="sidebar-group-title w-full flex items-center justify-between px-2 py-1.5 text-xs font-semibold text-gray-400 uppercase">
                        <span class="sidebar-group-title-text">管理</span>
                        <i class="fas fa-chevron-down text-[10px] sidebar-group-chevron"></i>
                    </button>
                    <div class="sidebar-group-items space-y-0.5 mt-1">
                        <button type="button" class="tab-btn" data-tab="storage-targets" role="tab">
                            <i class="fas fa-database w-4 text-center"></i><span class="sidebar-label">存储目标</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="storage-credentials" role="tab">
                            <i class="fas fa-key w-4 text-center"></i><span class="sidebar-label">存储凭据</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="dns-credentials" role="tab">
                            <i class="fas fa-server w-4 text-center"></i><span class="sidebar-label">DNS 凭据</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="root-domains" role="tab">
                            <i class="fas fa-sitemap w-4 text-center"></i><span class="sidebar-label">主域名</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="credentials" role="tab">
                            <i class="fas fa-id-card w-4 text-center"></i><span class="sidebar-label">CDN 凭据</span>
                        </button>
                        <button type="button" class="tab-btn" data-tab="users" role="tab">
                            <i class="fas fa-users w-4 text-center"></i><span class="sidebar-label">用户管理</span>
                        </button>
                    </div>
                </div>
                {% endif %}
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto px-4 md:px-6 py-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="bg-gray-800 text-white text-center py-4 shrink-0">
        <p class="text-xs md:text-sm">CDN管理器 v1.0 | 2026 © 本地部署 · SQLite · 多 CDN 提供商</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>

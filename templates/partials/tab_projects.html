<div id="tab-projects" class="tab-panel hidden">

    <div class="bg-white rounded-xl shadow-md p-5 mb-5">

        <h2 class="text-lg font-semibold mb-3 text-gray-800">新建项目</h2>

        <form id="createProjectForm" class="grid gap-3 md:grid-cols-3" action="#" method="post">

            <input type="text" name="name" placeholder="项目名称" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>

            <input type="text" name="description" placeholder="描述（可选）" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">

            <input type="text" name="allowed_users" placeholder="授权用户，逗号分隔；留空=所有人可见" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 md:col-span-2">

            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg transition font-medium md:col-span-3 xl:col-span-1">创建项目</button>

        </form>

        <div id="createProjectResult" class="mt-3 text-sm hidden"></div>

    </div>



    <div class="bg-white rounded-xl shadow-md p-5">

        <div class="flex items-center justify-between mb-4">

            <h2 class="text-lg font-semibold text-gray-800">项目与环境</h2>

            <p class="text-xs text-gray-500">管理 API Key 与用户授权；存储目标请在「存储目标」页绑定项目/环境</p>

        </div>

        <div id="projectsTree" class="space-y-4">

            <p class="text-gray-500 text-sm">加载中...</p>

        </div>

    </div>

</div>

<div id="tab-users" class="tab-panel hidden">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">用户管理</h2>
        <div class="mb-4 overflow-x-auto">
            <table class="min-w-full text-sm text-left text-gray-600">
                <thead>
                    <tr>
                        <th class="px-2 py-1 font-medium">用户名</th>
                        <th class="px-2 py-1 font-medium">角色</th>
                        <th class="px-2 py-1 font-medium">创建时间</th>
                        <th class="px-2 py-1 font-medium">最近更新</th>
                        <th class="px-2 py-1 font-medium">操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for usr in users %}
                    <tr class="border-t hover:bg-gray-50">
                        <td class="px-2 py-2">{{ usr.username }}</td>
                        <td class="px-2 py-2">{{ usr.role }}</td>
                        <td class="px-2 py-2">{{ usr.created_at }}</td>
                        <td class="px-2 py-2">{{ usr.updated_at or '-' }}</td>
                        <td class="px-2 py-2">
                            {% if usr.username != user.username and usr.username != 'admin' %}
                            <button type="button" class="delete-user-btn bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs transition" data-username="{{ usr.username }}">删除</button>
                            {% else %}
                            <span class="text-gray-400 text-xs">不可删除</span>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <form id="userForm" class="space-y-3">
            <div class="grid gap-4 sm:grid-cols-3">
                <input type="text" name="username" placeholder="用户名" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500" required>
                <input type="password" name="password" placeholder="密码（新用户必填，更新则留空保持不变）" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500" autocomplete="new-password">
                <select name="role" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm transition">保存用户</button>
            <div id="userResult" class="text-sm hidden"></div>
        </form>
    </div>
</div>

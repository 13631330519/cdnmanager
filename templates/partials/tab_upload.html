<div id="tab-upload" class="tab-panel hidden">
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">文件直传</h2>
        <p class="text-sm text-gray-600 mb-4">文件直传到对象存储（OSS/COS），不经服务器中转。大文件自动分片上传。</p>
        {% if storage_targets %}
        <div class="grid gap-4 md:grid-cols-2 mb-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">存储目标</label>
                <select id="uploadTargetSelect" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500">
                    {% for item in storage_targets %}
                    <option value="{{ item.id }}">{{ item.name }} ({{ storage_provider_labels.get(item.provider, item.provider) }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">远程路径前缀</label>
                <input type="text" id="uploadRemotePrefix" placeholder="如 2026/09/16/" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-4 mb-4">
            <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" id="uploadRefreshAfter" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" checked>
                <span>上传完成后刷新 CDN</span>
            </label>
            <label class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-4 py-2 rounded cursor-pointer hover:bg-indigo-100 transition">
                <i class="fas fa-folder-open"></i>
                <span>选择文件夹</span>
                <input type="file" id="uploadFolderInput" webkitdirectory directory multiple class="hidden">
            </label>
            <label class="inline-flex items-center gap-2 bg-gray-100 text-gray-700 px-4 py-2 rounded cursor-pointer hover:bg-gray-200 transition">
                <i class="fas fa-file"></i>
                <span>选择文件</span>
                <input type="file" id="uploadFileInput" multiple class="hidden">
            </label>
            <button type="button" id="uploadStartBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded transition disabled:opacity-50" disabled>开始上传</button>
            <button type="button" id="uploadCancelBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-5 py-2 rounded transition hidden">取消</button>
        </div>
        <div id="uploadSelectionSummary" class="text-sm text-gray-500 mb-2"></div>
        <div id="uploadProgressWrap" class="hidden">
            <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span id="uploadProgressText">准备中...</span>
                <span id="uploadProgressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 mb-3">
                <div id="uploadProgressBar" class="bg-indigo-600 h-3 rounded-full transition-all" style="width: 0%"></div>
            </div>
            <div id="uploadFailedList" class="text-sm text-red-600 max-h-40 overflow-y-auto"></div>
        </div>
        {% else %}
        <p class="text-amber-700 bg-amber-50 border border-amber-200 rounded p-4">请先在「存储目标」中配置 OSS/COS 目标。</p>
        {% endif %}
    </div>
</div>
